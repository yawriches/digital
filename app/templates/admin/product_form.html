{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product{% endblock %}

{% block admin_content %}
<div class="admin-page-header">
    <h1 class="admin-page-title">{{ 'Edit' if product else 'Add New' }} Product</h1>
    <a href="{{ url_for('admin.products') }}" class="btn btn-outline">Back to Products</a>
</div>

<div class="admin-form-card">
    <form method="POST" action="{{ url_for('admin.edit_product', product_id=product.id) if product else url_for('admin.add_product') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-input" value="{{ product.name if product else '' }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Brand</label>
                <input type="text" name="brand" class="form-input" value="{{ product.brand if product else '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">SKU</label>
                <input type="text" name="sku" class="form-input" value="{{ product.sku if product else '' }}" placeholder="Auto-generated if empty">
            </div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <select name="category_id" class="form-select" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {{ 'selected' if product and product.category_id == cat.id }}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Price ($)</label>
                <input type="number" name="price" class="form-input" step="0.01" value="{{ product.price if product else '' }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Compare Price ($)</label>
                <input type="number" name="compare_price" class="form-input" step="0.01" value="{{ product.compare_price if product else '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Stock Quantity</label>
                <input type="number" name="stock" class="form-input" value="{{ product.stock if product else 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Short Description</label>
                <input type="text" name="short_description" class="form-input" value="{{ product.short_description if product else '' }}">
            </div>
            <div class="form-group full">
                <label class="form-label">Full Description</label>
                <textarea name="description" class="form-textarea">{{ product.description if product else '' }}</textarea>
            </div>
            <div class="form-group full">
                <label class="form-label">Specifications</label>
                <textarea name="specifications" class="form-textarea" style="min-height: 80px;">{{ product.specifications if product else '' }}</textarea>
            </div>
            <div class="form-group full">
                <label class="form-label">Main Image URL</label>
                <input type="url" name="image_url" class="form-input" value="{{ product.image_url if product else '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Image URL 2</label>
                <input type="url" name="image_url_2" class="form-input" value="{{ product.image_url_2 if product else '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Image URL 3</label>
                <input type="url" name="image_url_3" class="form-input" value="{{ product.image_url_3 if product else '' }}">
            </div>
            <div class="form-group">
                <div class="form-check">
                    <input type="checkbox" name="is_featured" id="is_featured" {{ 'checked' if product and product.is_featured }}>
                    <label for="is_featured">Featured Product</label>
                </div>
            </div>
            <div class="form-group">
                <div class="form-check">
                    <input type="checkbox" name="is_active" id="is_active" {{ 'checked' if (product and product.is_active) or not product }}>
                    <label for="is_active">Active (Visible in store)</label>
                </div>
            </div>
        </div>

        <div style="margin-top: 24px; display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">{{ 'Update Product' if product else 'Add Product' }}</button>
            <a href="{{ url_for('admin.products') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h1 class="page-title">My Profile</h1>
        <p class="page-subtitle">Manage your account details</p>
    </div>
</div>

<section class="section">
    <div class="container" style="max-width: 700px;">
        <form method="POST" action="{{ url_for('auth.profile') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-input" value="{{ current_user.first_name }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-input" value="{{ current_user.last_name }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" value="{{ current_user.username }}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" value="{{ current_user.email }}" disabled>
                </div>
                <div class="form-group full">
                    <label class="form-label">Phone</label>
                    <input type="tel" name="phone" class="form-input" value="{{ current_user.phone }}">
                </div>
                <div class="form-group full">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-input" value="{{ current_user.address }}">
                </div>
                <div class="form-group">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-input" value="{{ current_user.city }}">
                </div>
                <div class="form-group">
                    <label class="form-label">State / Province</label>
                    <input type="text" name="state" class="form-input" value="{{ current_user.state }}">
                </div>
                <div class="form-group">
                    <label class="form-label">ZIP / Postal Code</label>
                    <input type="text" name="zip_code" class="form-input" value="{{ current_user.zip_code }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Country</label>
                    <input type="text" name="country" class="form-input" value="{{ current_user.country }}">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>

        <div style="margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border-color);">
            <p class="text-muted" style="font-size: 0.85rem;">Member since {{ current_user.created_at.strftime('%B %Y') }}</p>
        </div>
    </div>
</section>
{% endblock %}
